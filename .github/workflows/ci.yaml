name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  # The slowest test files skip on CRAN for check time and run here.
  NOT_CRAN: "true"
  # run.sh's own gate: R CMD check exits 0 on a WARNING and run_tests
  # passes that through, so a check ending "Status: 1 WARNING" is a
  # green tick; the non-ASCII WARNING sat under one here for months.
  # Set, run_tests greps 00check.log and fails the job. NOTEs still pass.
  WARNINGS_ARE_ERRORS: "true"
  # r-ci's defaults skip vignettes on both sides, and a package with
  # vignette sources then checks with a WARNING (files in vignettes/
  # but none in inst/doc). Build and check them; the runners have
  # pandoc and the Suggests step installs simplermarkdown.
  R_BUILD_ARGS: "--no-manual"
  R_CHECK_ARGS: "--no-manual --as-cran"
  # 0.8.0 was archived because a test made ~/bot on CRAN's check machine.
  # With the first of these set, R CMD check compares what the user owns
  # at the top of the home directory and of the temp root, and under
  # /dev/shm and ~/.cache, before and after, and reports a new file as a
  # NOTE. --as-cran already switches on the other two; they are set here
  # so the gate does not hang on that flag. NOTEs pass the WARNING gate
  # above, so the "Nothing left behind" step reads the three results.
  _R_CHECK_THINGS_IN_OTHER_DIRS_: "true"
  _R_CHECK_THINGS_IN_TEMP_DIR_: "true"
  _R_CHECK_THINGS_IN_CHECK_DIR_: "true"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::tinytest, any::simplermarkdown, any::chat.api, any::mx.client
      - name: Build and check with a fresh R home directory
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "corteza-check-home"
          New-Item -ItemType Directory $testHome | Out-Null
          $env:R_LIBS = Rscript --vanilla -e 'cat(paste(.libPaths(), collapse=";"))'
          $env:R_USER = $testHome
          $env:HOME = $testHome
          Rcmd.exe build --no-manual .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tar = (Get-Item corteza_*.tar.gz).FullName
          Rcmd.exe check --no-manual --as-cran $tar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $log = Get-Content corteza.Rcheck/00check.log
          if (!($log -match '^Status:') -or $log -match '^Status:.*(ERROR|WARNING)') {
            throw "Windows check did not pass"
          }
          if (!(Select-String 'All ok, [1-9][0-9,]+ results' corteza.Rcheck/tests/tinytest.Rout)) {
            throw "Missing successful tinytest run"
          }
          if (Get-ChildItem -Force $testHome) { throw "R home contains files after check" }
  ci:
    strategy:
      # A failure on one runner should not cancel the other: the second
      # result says whether the failure is the platform's or the code's.
      fail-fast: false
      matrix:
        include:
          # other_dirs_exclude: see the Test step.
          - {os: macos-latest, other_dirs_exclude: "^/(private/)?var/folders/"}
          - {os: ubuntu-latest, other_dirs_exclude: ""}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Install llm.api
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite", "tinyoauth"), repos = "https://cloud.r-project.org")'
          git clone --depth 1 https://github.com/cornball-ai/llm.api.git "$RUNNER_TEMP/llm.api"
          R CMD INSTALL "$RUNNER_TEMP/llm.api"

      - name: Dependencies
        env:
          GITHUB_PAT: ${{ github.token }}
        # run.sh invokes sudo without preserving GITHUB_PAT, reducing pinned
        # Remotes downloads to GitHub's exhausted anonymous IP allowance.
        run: sudo -E Rscript -e 'remotes::install_deps(".")'

      # The Matrix stack is Suggests, and _R_CHECK_FORCE_SUGGESTS_=false
      # lets check pass without it -- which it did, silently. Every Matrix
      # test sits behind a requireNamespace guard that exit_file()s the
      # whole integration file, so a run could go green having asserted
      # nothing about the transport work at all.
      #
      # From each repo's default branch rather than the drat, so what is
      # tested is what has actually landed upstream instead of whatever
      # was last published there. A corteza PR that needs an unmerged
      # upstream change therefore stays red until that change merges,
      # which is the intent: the verify step below is what says so, in
      # the one line worth reading. Order matters: mx.client imports
      # mx.api.
      # llm.api rides along even though it is an Imports and install_deps
      # already brought it from CRAN. Images in a room need llm_content(),
      # which is newer than the published build, and corteza
      # feature-detects it rather than raising the Imports floor -- a
      # floor above CRAN would make corteza uninstallable for everyone to
      # buy a check an exists() makes anyway. The cost of that choice is
      # that the media tests would skip themselves on a CRAN llm.api, so
      # the default branch goes on here and the verify step below says so.
      - name: Install Matrix stack
        run: |
          for pkg in mx.api mx.client chat.api llm.api; do
            # install_deps leaves llm.api's CRAN source unpacked here,
            # and git clone refuses a directory that is not empty.
            rm -rf "$RUNNER_TEMP/$pkg"
            git clone --depth 1 "https://github.com/cornball-ai/$pkg.git" "$RUNNER_TEMP/$pkg"
            R CMD INSTALL "$RUNNER_TEMP/$pkg"
          done

      # Fail loudly if the stack is absent or too old, rather than letting
      # the tests skip themselves into a green tick.
      #
      # One floor, because corteza has one runtime dependency here: it
      # calls neither mx.api nor mx.client any more, and carrying their
      # floors would be corteza asserting facts only chat.api can keep
      # true. mx.client is still installed above and still checked for
      # presence -- the integration tests stub it to drive a real relogin
      # through the whole stack, and a runner without it skips them.
      #
      # The floor is corteza's own runtime constant, read out of an
      # installed corteza, rather than parsed from DESCRIPTION. A first
      # attempt did parse it, and on macOS the parse quietly found no
      # floors at all and waved 0.0.1.2 through -- a verification step
      # that can silently check nothing is the same failure this whole
      # job exists to stop. It is the value bot_require_mx() enforces,
      # so if it is wrong the bots are wrong too.
      - name: Verify Matrix stack
        run: |
          R CMD INSTALL .
          Rscript -e '
            for (p in c("mx.api", "mx.client", "chat.api"))
              if (!requireNamespace(p, quietly = TRUE))
                stop("Matrix CI needs ", p, " installed", call. = FALSE)
            floor <- corteza:::.CHAT_API_MIN
            if (!length(floor) || !nzchar(floor))
              stop("could not read corteza chat.api floor", call. = FALSE)
            have <- utils::packageVersion("chat.api")
            message("chat.api ", have, " (>= ", floor, ")")
            if (have < floor)
              stop("chat.api ", have, " is below the ", floor,
                   " this corteza requires", call. = FALSE)
            message("mx.api ", utils::packageVersion("mx.api"))
            message("mx.client ", utils::packageVersion("mx.client"))
            message("llm.api ", utils::packageVersion("llm.api"))
            if (!corteza:::bot_llm_multimodal())
              stop("this llm.api has no llm_content(): every image test ",
                   "would skip itself and the run would go green",
                   call. = FALSE)'

      # install_deps brings Imports only, and a check without the
      # VignetteBuilder is a WARNING ("Cannot process vignettes"), which
      # the gate above fails. These are the Suggests CRAN carries that
      # the check and the vignettes read; the ones left out (rgrpc,
      # RProtoBuf) stay a NOTE under _R_CHECK_FORCE_SUGGESTS_=false
      # and their tests keep skipping, as before.
      - name: Suggests from CRAN
        run: Rscript -e 'install.packages(c("clipr", "fortunes", "pensar", "rstudioapi", "simplermarkdown"), repos = "https://cloud.r-project.org")'

      # On macOS the temp root is a folder every process of the user
      # shares, and system services make folders in it while the check
      # runs: 4 on this gate's first run, none of them the package's.
      # The pattern drops that folder from the comparison there. The
      # home directory is still compared, and so is R's own session
      # temp directory. Empty on Linux, where nothing is dropped.
      - name: Test
        env:
          _R_CHECK_THINGS_IN_OTHER_DIRS_EXCLUDE_: ${{ matrix.other_dirs_exclude }}
        run: ./run.sh run_tests

      # A NOTE does not fail the Test step. This fails on the three that
      # say the check left something behind, and on a log without them:
      # a check that is switched off prints nothing, and a gate that
      # cannot see the check has not passed it.
      - name: Nothing left behind
        run: tools/check_left_behind.sh corteza.Rcheck/00check.log

      # Two more checks, each from an empty home directory in a bare
      # environment. The step above cannot see everything: R CMD check
      # does not compare ~/.local/share, where corteza keeps its data,
      # and it reports only what is new, on a runner whose home is not
      # empty to begin with. Once as CRAN runs the package and once with
      # the test files CRAN skips: on 0.8.0 the first made 1 directory
      # in the home and the second 4. Each runs even when a step above
      # fails, so one run shows every result.
      - name: Empty home, as CRAN runs it
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CLEAN_HOME_PARENT: ${{ runner.temp }}
        run: env -u NOT_CRAN tools/check_clean_home.sh

      - name: Empty home, every test file
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CLEAN_HOME_PARENT: ${{ runner.temp }}
        run: tools/check_clean_home.sh

      # R CMD check prints the last 13 lines of a failed test run, which
      # for this suite is the warnings that trail the real failure. The
      # failing assertions are in the .Rout.fail the check leaves behind.
      - name: Show failed test output
        if: failure()
        run: |
          f=corteza.Rcheck/tests/tinytest.Rout.fail
          if [ -f "$f" ]; then
            grep -n -A12 'FAILED\[\|^Error' "$f" | head -400
          else
            echo "no $f"
          fi
