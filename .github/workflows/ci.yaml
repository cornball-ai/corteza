name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      # macos-latest moved to arm64 and r-ci's macOS bootstrap stopped
      # leaving `remotes` behind. run.sh install_deps calls it directly,
      # so the dependency step died before any package code was parsed --
      # and with fail-fast on, it cancelled the Linux leg too, which is
      # the leg that actually gates these packages.
      #
      # Guarded on absence: a no-op on Linux, and it deletes itself the
      # day upstream ships the fix rather than pinning us to an old image.
      - name: Bootstrap remotes
        run: >-
          Rscript -e 'if (!requireNamespace("remotes", quietly = TRUE))
          install.packages("remotes", repos = "https://cloud.r-project.org")'

      - name: Install llm.api
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite", "tinyoauth"), repos = "https://cloud.r-project.org")'
          git clone --depth 1 https://github.com/cornball-ai/llm.api.git "$RUNNER_TEMP/llm.api"
          R CMD INSTALL "$RUNNER_TEMP/llm.api"

      - name: Dependencies
        run: ./run.sh install_deps

      # The Matrix stack is Suggests, and _R_CHECK_FORCE_SUGGESTS_=false
      # lets check pass without it -- which it did, silently. Every Matrix
      # test sits behind a requireNamespace guard that exit_file()s the
      # whole integration file, so a run could go green having asserted
      # nothing about the transport work at all.
      #
      # From each repo's default branch rather than the drat, so what is
      # tested is what has actually landed upstream instead of whatever
      # was last published there. A corteza PR that needs an unmerged
      # upstream change therefore stays red until that change merges,
      # which is the intent: the verify step below is what says so, in
      # the one line worth reading. Order matters: mx.client imports
      # mx.api.
      # llm.api rides along even though it is an Imports and install_deps
      # already brought it from CRAN. Images in a room need llm_content(),
      # which is newer than the published build, and corteza
      # feature-detects it rather than raising the Imports floor -- a
      # floor above CRAN would make corteza uninstallable for everyone to
      # buy a check an exists() makes anyway. The cost of that choice is
      # that the media tests would skip themselves on a CRAN llm.api, so
      # the default branch goes on here and the verify step below says so.
      - name: Install Matrix stack
        run: |
          for pkg in mx.api mx.client chat.api llm.api; do
            # install_deps leaves llm.api's CRAN source unpacked here,
            # and git clone refuses a directory that is not empty.
            rm -rf "$RUNNER_TEMP/$pkg"
            git clone --depth 1 "https://github.com/cornball-ai/$pkg.git" "$RUNNER_TEMP/$pkg"
            R CMD INSTALL "$RUNNER_TEMP/$pkg"
          done

      # Fail loudly if the stack is absent or too old, rather than letting
      # the tests skip themselves into a green tick.
      #
      # One floor, because corteza has one runtime dependency here: it
      # calls neither mx.api nor mx.client any more, and carrying their
      # floors would be corteza asserting facts only chat.api can keep
      # true. mx.client is still installed above and still checked for
      # presence -- the integration tests stub it to drive a real relogin
      # through the whole stack, and a runner without it skips them.
      #
      # The floor is corteza's own runtime constant, read out of an
      # installed corteza, rather than parsed from DESCRIPTION. A first
      # attempt did parse it, and on macOS the parse quietly found no
      # floors at all and waved 0.0.1.2 through -- a verification step
      # that can silently check nothing is the same failure this whole
      # job exists to stop. It is the value bot_require_mx() enforces,
      # so if it is wrong the bots are wrong too.
      - name: Verify Matrix stack
        run: |
          R CMD INSTALL .
          Rscript -e '
            for (p in c("mx.api", "mx.client", "chat.api"))
              if (!requireNamespace(p, quietly = TRUE))
                stop("Matrix CI needs ", p, " installed", call. = FALSE)
            floor <- corteza:::.CHAT_API_MIN
            if (!length(floor) || !nzchar(floor))
              stop("could not read corteza chat.api floor", call. = FALSE)
            have <- utils::packageVersion("chat.api")
            message("chat.api ", have, " (>= ", floor, ")")
            if (have < floor)
              stop("chat.api ", have, " is below the ", floor,
                   " this corteza requires", call. = FALSE)
            message("mx.api ", utils::packageVersion("mx.api"))
            message("mx.client ", utils::packageVersion("mx.client"))
            message("llm.api ", utils::packageVersion("llm.api"))
            if (!corteza:::bot_llm_multimodal())
              stop("this llm.api has no llm_content(): every image test ",
                   "would skip itself and the run would go green",
                   call. = FALSE)'

      - name: Test
        run: ./run.sh run_tests
