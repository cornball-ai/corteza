name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Install llm.api
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite", "tinyoauth"), repos = "https://cloud.r-project.org")'
          git clone --depth 1 https://github.com/cornball-ai/llm.api.git "$RUNNER_TEMP/llm.api"
          R CMD INSTALL "$RUNNER_TEMP/llm.api"

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests
